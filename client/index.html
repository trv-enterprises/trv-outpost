<!doctype html>
<html lang="en" data-carbon-theme="g100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brain.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRV Outpost</title>
    <!-- Installable web app (Add to Home Screen). The manifest's
         display:standalone launches the app without any browser chrome —
         the supported way to a truly fullscreen dashboard on iPhone, where
         Safari has no element-fullscreen API. Android reads the same
         manifest for its install prompt. Icons are the brain logo composed
         onto the g100 background (iOS fills transparency with white). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Outpost" />
    <!-- Opaque black status bar: content starts BELOW it, so no
         safe-area-inset plumbing is needed in the app shell. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#161616" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
