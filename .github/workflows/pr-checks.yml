name: PR Checks

# Validation gates that run on every pull request into main (and on
# pushes to main as a backstop). Mirrors the local pre-release gates so
# a green PR means the same things `make release` would enforce, minus
# the release-only steps (tagging, image build, build-number bump).
#
# The four jobs match the agreed feature-branch flow:
#   client     — lint:strict + chart-spec verify + vite build
#   server     — go build + go vet
#   go-tests   — go test ./... (includes chat schema-parity guard)
#   api-docs   — regenerate swagger + postman, fail if committed docs are stale
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer commit on the same PR/branch cancels the older in-flight run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (lint + chart-spec + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # --legacy-peer-deps matches client/Dockerfile — the project has a
      # known @clerk/clerk-react ↔ react peer-range conflict that strict
      # npm-ci resolution rejects. This is how the image installs too.
      - name: Install deps
        working-directory: client
        run: npm ci --legacy-peer-deps

      # Run the pre-release sub-steps directly rather than `npm run build`,
      # because `npm run build` first runs increment-build.js which bumps
      # client/build.json — a release-time concern, not a PR concern. We
      # want the exact same lint + chart-spec + vite build gates without
      # the side effect.
      - name: Lint (strict)
        working-directory: client
        run: npm run lint:strict

      - name: Verify chart-spec build options
        working-directory: client
        run: npm run verify:chart-spec

      # Component render tests (vitest + testing-library, introduced with
      # the #248 store-picker regression test). Render-path bugs — a control
      # unreachable in one branch of a transport/type chain — are invisible
      # to lint and the pure-node chart-spec checks.
      - name: Component tests
        working-directory: client
        run: npm test

      - name: Vite build
        working-directory: client
        run: npx vite build

  server:
    name: Server (go build + vet)
    runs-on: ubuntu-latest
    steps:
      # Need the merge-base to diff against, so fetch history rather than
      # the default shallow clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - name: go build
        working-directory: server-go
        run: go build ./...

      - name: go vet
        working-directory: server-go
        run: go vet ./...

      # govulncheck — reachability-aware Go vulnerability scan. Added
      # 2026-08-07 after it caught two REACHABLE vulns in the v0.51.0
      # dependency sweep that Dependabot never reported (Dependabot matches
      # manifests; govulncheck analyzes the call graph, so it both finds
      # vulns in indirect deps and stays quiet about unreachable ones).
      # The tool is installed at latest — its vuln DB is fetched live at
      # run time either way, so pinning the binary buys no reproducibility
      # on findings, only staleness in the analyzer.
      #
      # Reconciled against security/accepted-vulns.yaml rather than run bare:
      # a bare `govulncheck ./...` has no way to express a consciously accepted
      # risk, so ONE unfixable advisory in a dependency blocks every PR forever
      # (lib/pq, 2026-08-18 — 7 advisories, all "Fixed in: N/A"). The registry
      # is human-authored, code-reviewed, and every entry carries a mandatory
      # expiry, so acceptance is explicit and re-reviewed rather than silent.
      # Same reconciler `make security-scan` uses, so CI and the release gate
      # agree. A finding NOT in the registry still fails the job.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd server-go && govulncheck -json ./... 2>/dev/null) \
            | python3 security/reconcile-scan.py --scanner govulncheck --label "govulncheck (Go deps + stdlib)"

      # gofmt, scoped to the Go files THIS PR touches.
      #
      # Deliberately not `gofmt -l ./...`: a large number of files predate
      # this check and differ only in whitespace (gofmt column-aligns struct
      # fields and trailing comments, and hand-edits drift the padding).
      # Failing the whole repo would either block every PR or force a
      # codebase-wide reformat that destroys git blame. Scoping to changed
      # files means new and edited code is formatted from here on, and the
      # backlog gets cleaned up incidentally as files are touched.
      #
      # Skipped on push-to-main (no PR to diff against); the PR run is the
      # gate. Deleted files are excluded via --diff-filter=d.
      - name: gofmt (changed files)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          # xargs -0 passes each filename as its own argument, so this can't
          # depend on shell word-splitting. An unquoted "$files" string works
          # in bash but silently collapses to ONE bogus filename in zsh, and
          # gofmt then reports nothing — the check would pass everything.
          # (mapfile -d would also work but needs bash 4+, which macOS lacks,
          # making this untestable locally.) Don't "simplify" this.
          files="$(git diff --name-only --diff-filter=d "$base"...HEAD -- '*.go')"
          if [ -z "$files" ]; then
            echo "No Go files changed."
            exit 0
          fi
          printf 'Checking:\n'; printf '%s\n' "$files" | sed 's/^/  /'
          unformatted="$(
            git diff -z --name-only --diff-filter=d "$base"...HEAD -- '*.go' \
              | xargs -0 gofmt -l
          )"
          if [ -n "$unformatted" ]; then
            echo
            echo "::error::Changed Go files are not gofmt-formatted (see diff below)"
            printf '%s\n' "$unformatted" | sed 's/^/  /'
            echo
            echo "Fix with:  gofmt -w $(printf '%s ' $unformatted)"
            echo
            echo "--- diff ---"
            printf '%s\n' "$unformatted" | tr '\n' '\0' | xargs -0 gofmt -d
            exit 1
          fi
          echo "All changed Go files are formatted."

  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - name: go test
        working-directory: server-go
        run: go test ./...

  api-docs:
    name: API docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pin the swag CLI to the library version in server-go/go.mod so the
      # generated spec matches what the running server serves. (Mismatched
      # swag CLI vs library historically produced incompatible output.)
      - name: Install swag CLI (matched to go.mod)
        working-directory: server-go
        run: |
          swag_ver="$(go list -m -f '{{.Version}}' github.com/swaggo/swag)"
          echo "Installing swag ${swag_ver}"
          go install "github.com/swaggo/swag/cmd/swag@${swag_ver}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate + verify API docs are current
        run: make api-docs-check
