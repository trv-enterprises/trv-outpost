# Accepted-vulnerability registry
# ================================
# The single source of truth for vulnerabilities we have CONSCIOUSLY ACCEPTED
# because their blast radius does not affect this system (or remediation is
# gated on an upstream/toolchain bump we don't yet have). The release security
# scan (`make security-scan`) reconciles scanner output against this file:
#   - a finding whose ID is listed here (and not expired) → reported as
#     "Known-accepted", suppressed from the actionable list.
#   - any finding NOT listed here → reported as "ACTIONABLE".
#
# This file is human-authored and code-reviewed. Adding an entry is an explicit
# risk-acceptance decision — write the justification as if defending it in an
# audit. Reconciliation tooling: security/reconcile-scan.py.
#
# ── Entry schema ─────────────────────────────────────────────────────────────
#   id:            REQUIRED. The scanner's advisory ID, matched verbatim against
#                  scan output. govulncheck → "GO-YYYY-NNNN". npm audit → the
#                  GHSA id ("GHSA-xxxx-...") or advisory URL fragment.
#   scanner:       REQUIRED. one of: govulncheck | npm-audit | gitleaks
#   module:        REQUIRED. the affected module/package (for humans).
#   accepted_by:   REQUIRED. who made the risk-acceptance decision.
#   accepted_on:   REQUIRED. ISO date (YYYY-MM-DD) the exception was granted.
#   expires_on:    REQUIRED. ISO date after which this exception is INVALID and
#                  the finding becomes actionable again (forces periodic re-review;
#                  an exception is never permanent). Re-affirm or remediate by then.
#   reason:        REQUIRED. why the blast radius does not affect THIS system.
#                  Be specific about the unreachable path / unused feature / why
#                  the fix is gated.
#   remediation:   OPTIONAL. the known fix (e.g. "Go 1.26.4" / "bump x to vN"),
#                  so re-review is a quick "is the fix available to us yet?".
#
# gitleaks: secret leaks are NEVER accepted via this file. A committed secret is
# always actionable (rotate + purge). gitleaks entries exist only to suppress
# documented FALSE POSITIVES (e.g. a fixture that looks like a key but isn't);
# use sparingly and justify hard.

exceptions:
  # GO-2025-4134 / GO-2025-4135 (golang.org/x/crypto/ssh*) were here but are now
  # fully resolved by the golang.org/x/* bump on 2026-06-10 — no longer reported
  # by govulncheck, so they need no exception. Removed rather than left stale.
  - id: GO-2026-4503
    scanner: govulncheck
    module: filippo.io/edwards25519@v1.1.0
    accepted_by: Tom Viviano
    accepted_on: 2026-05-03
    expires_on: 2026-09-01
    reason: >
      Indirect transitive dependency. The vulnerable code path is not reached by
      any caller in our dependency graph — govulncheck reports it below the
      symbol-reachable tier (the reconcile script's actionable list is
      symbol-reachable only, so this never surfaces as actionable). No data flow
      from our code touches it. Kept as an explicit, audited acceptance.
    remediation: Fixed in edwards25519 v1.1.1; resolves when an ancestor module bumps its pin.

  - id: GHSA-qjx8-664m-686j
    scanner: npm-audit
    module: js-cookie (transitive, via @clerk/shared)
    accepted_by: Tom Viviano
    accepted_on: 2026-06-10
    expires_on: 2026-09-01
    reason: >
      js-cookie's ONLY consumer in our tree is @clerk/shared (Clerk's browser
      SDK) — our own code never imports it. @clerk/shared pins js-cookie@3.0.5
      EXACTLY. We briefly overrode it to 3.0.8 (the patched line) in v0.29.0
      and it BROKE Clerk login (the 3.0.6 cookie-attribute change caused Clerk's
      cookie writes to be rejected — "__clerk_test_etld rejected for invalid
      domain"). Reverted the override in v0.29.1. The advisory (per-instance
      prototype hijack in assign() enabling cookie-attribute injection) requires
      attacker-controlled input into a js-cookie instance's assign(); in Clerk's
      usage js-cookie only writes Clerk's own session cookies with Clerk-
      controlled attributes, so the practical exposure here is negligible.
      This is Clerk's dependency to fix.
    remediation: >
      Bump @clerk/clerk-react / @clerk/shared once Clerk ships a release that
      pins a patched js-cookie (>=3.0.6). Do NOT force it via npm overrides —
      that breaks Clerk's cookie handling.

  - id: GHSA-qwww-vcr4-c8h2
    scanner: npm-audit
    module: react-router / react-router-dom (7.18.2)
    accepted_by: Tom Viviano
    accepted_on: 2026-08-01
    expires_on: 2026-11-01
    reason: >
      "RSC Mode CSRF Bypass Allows Action Execution Before 400 Response". The
      vulnerable path requires react-router running SERVER-SIDE in RSC mode,
      dispatching actions on POST. Neither condition exists here, for two
      independent reasons. (1) The source uses BrowserRouter/HashRouter from
      react-router-dom in a client-only Vite SPA — no RSC or SSR imports
      anywhere in client/src. (2) The deployed client image cannot execute
      react-router at all: client/Dockerfile builds to static assets and then
      DISCARDS the Node stage, shipping `FROM caddy:2-alpine` + /srv. Caddy
      either reverse-proxies to the Go server (/api, /health, /swagger, /mcp,
      /docs) or serves files via `try_files {path} /index.html` — the SPA
      fallback returns index.html as a STATIC FILE, so a POST to an app route
      never reaches a react-router action handler. Routing happens in the
      browser after the bundle loads.
      Note the advisory range (>=7.12.0 <8.3.0) has NO fixed 7.x release; npm's
      only offered "fix" is a DOWNGRADE to react-router-dom 7.11.0, seven minors
      back and flagged semver-major. We deliberately went the other way and
      upgraded 7.17.0 -> 7.18.2, which clears the four other react-router
      advisories (GHSA-wrjc-x8rr-h8h6 open redirect, GHSA-h8fp-f39c-q6mh
      RSCErrorHandler XSS, GHSA-337j-9hxr-rhxg deserializeErrors constructor
      injection, GHSA-chx6-hx7r-mcp5 route-matching DoS — all fixed in 7.18.0).
      RE-REVIEW TRIGGER: this acceptance is contingent on the deployment
      topology. If the app ever adopts SSR/RSC mode, or is served by a Node
      runtime that dispatches react-router actions instead of Caddy static
      hosting, this advisory becomes LIVE and must be re-evaluated immediately.
    remediation: >
      Upgrade to react-router-dom >=8.3.0 when the v8 migration is undertaken.
      No 7.x fix exists — the range is unpatched through 8.2.x.
